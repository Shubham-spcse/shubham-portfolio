<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Shubham Prajapati</title>
  <style>
    :root {
      --bg:   #070B14;
      --cyan: #00D9FF;
      --text: #F1F5F9;
      --muted:#B8C1D1;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 20px;
    }
    .icon {
      font-size: 4rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -1px; }
    h1 span { color: var(--cyan); }
    p { color: var(--muted); max-width: 380px; line-height: 1.75; }
    a {
      margin-top: 8px;
      display: inline-block;
      padding: 12px 28px;
      background: var(--cyan);
      color: #000;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,217,255,.4);
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity:1;   }
      50%      { transform: scale(1.1); opacity:0.7; }
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're <span>Offline</span></h1>
  <p>
    It looks like you've lost your internet connection.
    Check your network and try again.
  </p>
  <a href="/" onclick="location.reload(); return false;">Try Again</a>
</body>
</html>
